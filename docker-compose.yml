# =====================================================================
# BRACE RCE — Single-Container Docker Compose
#
# Consolidates all services into one container:
#   • Node.js API + Socket.io (port 5000)
#   • PM2 queue worker (code execution, emails, notifications)
#   • Piston code execution engine (port 2000, Java/JS/Python/C/C++)
#
# Removed containers: piston, redis, postgres, nginx, certbot
#
# External dependencies (run on host or managed service):
#   • PostgreSQL — DATABASE_URL
#   • Redis — REDIS_URL
#   • SSL/TLS — handled at load balancer / edge
#
# Build:  docker compose build
# Run:    docker compose up -d
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: brace-app:latest
    container_name: brace-app
    privileged: true
    restart: always
    ports:
      - "5000:5000"
      - "2000:2000"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_MODE=${NODE_MODE:-production}
      # External PostgreSQL (host or managed service)
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      # External Redis (host or managed service)
      - REDIS_URL=${REDIS_URL}
      # Piston runs locally in this container
      - PISTON_URL=http://127.0.0.1:2000
      - FRONTEND_URL=${FRONTEND_URL:-https://bracerce.devsharma.dev}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://bracerce.devsharma.dev,https://bracerce.server.devsharma.dev}
      - GITHUB_KEY=${GITHUB_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-production_super_secret_jwt_key_brace_2026}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}
      - FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID}
    # No volumes needed — certbot, postgres data removed
    # No depends_on — Piston and Redis run in-container or externally
