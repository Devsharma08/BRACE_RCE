version: '3.8'

services:
  # BRACE_RCE Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://brace_user:brace_password@postgres:5432/brace_rce?schema=public
      - JWT_SECRET=production_super_secret_jwt_key_brace_2026
      - PISTON_URL=http://piston:2000
      - FRONTEND_URL=http://localhost:5000
    depends_on:
      - postgres
      - piston

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: brace_user
      POSTGRES_PASSWORD: brace_password
      POSTGRES_DB: brace_rce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Piston Code Execution Engine
  piston:
    image: ghcr.io/engineer-man/piston
    restart: always
    ports:
      - "2000:2000"
    tmpfs:
      - /tmp

volumes:
  postgres_data:
