worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server_tokens off;

    # Gzip compression (for API responses proxied from backend)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # Upstream to the Node.js app (PM2 cluster or single instance)
    upstream app_backend {
        server app:5000;
        keepalive 32;
    }

    # HTTP — redirect to HTTPS
    server {
        listen 80;
        server_name bracerce.server.devsharma.dev;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name bracerce.server.devsharma.dev;

        ssl_certificate /etc/letsencrypt/live/bracerce.server.devsharma.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bracerce.server.devsharma.dev/privkey.pem;

        include /etc/nginx/ssl-common.conf;
        include /etc/nginx/locations.conf;
    }
}