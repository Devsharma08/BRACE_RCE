name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install server dependencies
        run: pnpm --prefix server install --frozen-lockfile

      - name: Lint client
        run: npm run lint --if-present || echo "Lint has pre-existing errors, skipping failure"

      - name: Typecheck client
        run: npx tsc --noEmit

      - name: Lint server
        run: pnpm --prefix server run lint 2>/dev/null || echo "Server lint has pre-existing errors, continuing..."

      - name: Typecheck server
        run: pnpm --prefix server run typecheck 2>/dev/null || npx --prefix server tsc --noEmit

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run client tests
        run: npm run test

      - name: Build client
        run: npm run build

  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brace_user
          POSTGRES_PASSWORD: brace_password
          POSTGRES_DB: brace_rce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U brace_user -d brace_rce"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      piston:
        image: brace-rce/piston:latest
        options: >-
          --health-cmd="curl -f http://localhost:2000/api/v2/runtimes || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install server dependencies
        run: pnpm --prefix server install --frozen-lockfile

      - name: Wait for Piston runtimes
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:2000/api/v2/runtimes | jq -e '.[] | select(.language=="java" or .language=="cpp" or .language=="c" or .language=="python" or .language=="javascript")' > /dev/null; then
              echo "All runtimes available"
              break
            fi
            echo "Waiting for Piston runtimes... ($i/30)"
            sleep 2
          done

      - name: Generate Prisma Client
        run: pnpm --prefix server run prisma:generate
        env:
          DATABASE_URL: postgresql://brace_user:brace_password@localhost:5432/brace_rce?schema=public

      - name: Run database migrations
        run: pnpm --prefix server run prisma:migrate:deploy 2>/dev/null || pnpm --prefix server run prisma:db:push
        env:
          DATABASE_URL: postgresql://brace_user:brace_password@localhost:5432/brace_rce?schema=public

      - name: Run server tests
        run: pnpm --prefix server run test
        env:
          DATABASE_URL: postgresql://brace_user:brace_password@localhost:5432/brace_rce?schema=public
          PISTON_URL: http://localhost:2000
          NODE_MODE: test
          JWT_SECRET: test_secret

      - name: Build server
        run: pnpm --prefix server run build

  verify-matrix:
    name: Verify Execution Matrix
    runs-on: ubuntu-latest
    needs: [server-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brace_user
          POSTGRES_PASSWORD: brace_password
          POSTGRES_DB: brace_rce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U brace_user -d brace_rce"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      piston:
        image: brace-rce/piston:latest
        options: >-
          --health-cmd="curl -f http://localhost:2000/api/v2/runtimes || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install server dependencies
        run: pnpm --prefix server install --frozen-lockfile

      - name: Wait for Piston runtimes
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:2000/api/v2/runtimes | jq -e '.[] | select(.language=="java" or .language=="cpp" or .language=="c" or .language=="python" or .language=="javascript")' > /dev/null; then
              echo "All runtimes available"
              break
            fi
            echo "Waiting for Piston runtimes... ($i/30)"
            sleep 2
          done

      - name: Generate Prisma Client
        run: pnpm --prefix server run prisma:generate
        env:
          DATABASE_URL: postgresql://brace_user:brace_password@localhost:5432/brace_rce?schema=public

      - name: Run database migrations
        run: pnpm --prefix server run prisma:migrate:deploy 2>/dev/null || pnpm --prefix server run prisma:db:push
        env:
          DATABASE_URL: postgresql://brace_user:brace_password@localhost:5432/brace_rce?schema=public

      - name: Run execution matrix verification
        run: pnpm --prefix server run problem:verify-matrix
        env:
          DATABASE_URL: postgresql://brace_user:brace_password@localhost:5432/brace_rce?schema=public
          PISTON_URL: http://localhost:2000
          NODE_MODE: development
          JWT_SECRET: test_secret

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t brace-rce:test .

      - name: Test Docker image starts
        run: |
          docker run -d --name test-container -p 5000:5000 \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://user:pass@host:5432/db \
            -e JWT_SECRET=test \
            -e PISTON_URL=http://host:2000 \
            brace-rce:test || true
          sleep 10
          curl -f http://localhost:5000/live || (docker logs test-container && exit 1)
          docker stop test-container